name: Site Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
          cache-dependency-path: '.github/glossary-app/package-lock.json'

      - name: Installa poppler (anteprime PDF)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Installa dipendenze glossario
        working-directory: .github/glossary-app
        run: npm ci

      - name: Valida dati glossario
        working-directory: .github/glossary-app
        run: npm run validate:data

      - name: Compila glossario Angular
        working-directory: .github/glossary-app
        run: npm run build

      - name: Genera Sito (HTML, CSS, Asset, Documenti)
        run: python .github/site-src/update_index.py

      - name: Installa Chromium per i test
        working-directory: .github/glossary-app
        run: npx playwright install --with-deps chromium

      - name: Genera anteprima del glossario
        working-directory: .github/glossary-app
        run: npm run capture:glossary-thumbnail

      - name: Test browser e accessibilità del sito
        working-directory: .github/glossary-app
        run: npm run test:e2e

      - name: Carica diagnostica Playwright in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-playwright-report
          path: |
            .github/glossary-app/playwright-report/
            .github/glossary-app/test-results/
          retention-days: 7

      - name: Debug - Elenca file generati
        run: ls -R _site/

      - name: Upload Artifact di Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
